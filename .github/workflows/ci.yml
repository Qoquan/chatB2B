name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint, Format, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Base Postgres jetable, propre à ce run de CI (aucun lien avec la base
    # de production) : sert uniquement aux tests d'intégration Vitest.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatb2b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatb2b_test
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Prisma — génération du client + schéma
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Tests (Vitest)
        run: npm test

  frontend:
    name: Frontend — Lint & Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
