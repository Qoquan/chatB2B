# Infra-as-code Render : décrit le backend et le site statique.
# La base PostgreSQL est hébergée sur Neon : ses deux URL se renseignent dans Render.

services:
  - type: web
    name: chatb2b-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # connexion Neon "pooled" (hôte contenant "-pooler")
      - key: DIRECT_URL
        sync: false # connexion Neon directe, utilisée par les migrations
      - key: FRONTEND_URL
        sync: false # URL publique du site statique

  - type: web
    name: chatb2b-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
