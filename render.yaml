# Infra-as-code Render — permet de déployer backend + DB en un clic
# via "New > Blueprint" sur render.com en pointant ce repo

services:
  - type: web
    name: chatb2b-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: chatb2b-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false # à renseigner manuellement (URL Vercel ou Render du frontend)

  - type: web
    name: chatb2b-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

databases:
  - name: chatb2b-db
    plan: free
